<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // 1. Stub out WebSocket for Vite HMR in iframe/Cloud Run environments
      (function() {
        if (typeof window !== 'undefined') {
          const OriginalWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            const urlStr = String(url || '');
            // Only intercept HMR WebSocket connections
            if (urlStr.includes('@vite') || urlStr.includes('vite') || urlStr.includes('run.app')) {
              const fakeSocket = {
                readyState: 3, // CLOSED
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                url: urlStr,
                bufferedAmount: 0,
                extensions: '',
                protocol: '',
                binaryType: 'blob',
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return false; },
                send: function() {},
                close: function() {},
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };
              return fakeSocket;
            }
            return new OriginalWebSocket(url, protocols);
          };
          if (OriginalWebSocket) {
            window.WebSocket.prototype = OriginalWebSocket.prototype;
            window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
            window.WebSocket.OPEN = OriginalWebSocket.OPEN;
            window.WebSocket.CLOSING = OriginalWebSocket.CLOSING;
            window.WebSocket.CLOSED = OriginalWebSocket.CLOSED;
          }

          // 2. Catch any stray unhandled rejection from any source
          window.addEventListener('unhandledrejection', function(event) {
            var msg = String(event?.reason?.message || event?.reason || '');
            if (msg.includes('WebSocket') || msg.includes('ws://') || msg.includes('wss://') || msg.includes('closed without opened')) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);

          // 3. Catch error events
          window.addEventListener('error', function(event) {
            var msg = String(event?.message || event?.error?.message || event || '');
            if (msg.includes('WebSocket') || msg.includes('ws://') || msg.includes('wss://') || msg.includes('closed without opened')) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);
        }
      })();
    </script>
